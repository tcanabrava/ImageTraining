[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equipment-fitter"
version = "0.1.0"
description = "Fit RGBA equipment to existing character spritesheets"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<14"]

[project.optional-dependencies]
train = ["torch>=2.2,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
equipment-fitter = "equipment_fitter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
